schemaVersion: '1.0'
name: 'Zannora Navigation & Page Smoke Test'
target:
  platform: 'web'
  baseUrl: 'http://127.0.0.1:8000'
variables:
  QC_ZANNORA_EMAIL: 'admin@zannora.com'
  QC_ZANNORA_PASSWORD: 'password'
execution:
  timeoutMs: 45000
  retries: 0
  screenshot: 'always'
  trace: 'retain-on-failure'
  video: 'on'
steps:
  - id: 'open-login'
    action: 'open'
    url: '/login'
  - id: 'login-email'
    action: 'input'
    target:
      strategy: 'css'
      value: 'input[name="email"]'
    value: '${QC_ZANNORA_EMAIL}'
  - id: 'login-password'
    action: 'input'
    target:
      strategy: 'css'
      value: 'input[name="password"]'
    value: '${QC_ZANNORA_PASSWORD}'
  - id: 'login-submit'
    action: 'click'
    target:
      strategy: 'css'
      value: 'button[type="submit"]'
  - id: 'login-assert'
    action: 'assertUrl'
    value: '/admin/dashboard'
  - id: 'snap-dashboard'
    action: 'screenshot'
    name: 'admin-dashboard'
  - id: 'open-airlines'
    action: 'open'
    url: '/admin/airlines'
  - id: 'assert-airlines'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-airlines'
    action: 'screenshot'
    name: 'admin-airlines'
  - id: 'open-airports'
    action: 'open'
    url: '/admin/airports'
  - id: 'assert-airports'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-airports'
    action: 'screenshot'
    name: 'admin-airports'
  - id: 'open-airplanes'
    action: 'open'
    url: '/admin/airplanes'
  - id: 'assert-airplanes'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-airplanes'
    action: 'screenshot'
    name: 'admin-airplanes'
  - id: 'open-flights'
    action: 'open'
    url: '/admin/flights'
  - id: 'assert-flights'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-flights'
    action: 'screenshot'
    name: 'admin-flights'
  - id: 'open-bookings'
    action: 'open'
    url: '/admin/bookings'
  - id: 'assert-bookings'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-bookings'
    action: 'screenshot'
    name: 'admin-bookings'
  - id: 'open-payments'
    action: 'open'
    url: '/admin/payments'
  - id: 'assert-payments'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-payments'
    action: 'screenshot'
    name: 'admin-payments'
  - id: 'open-tickets'
    action: 'open'
    url: '/admin/tickets'
  - id: 'assert-tickets'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-tickets'
    action: 'screenshot'
    name: 'admin-tickets'
  - id: 'open-reports'
    action: 'open'
    url: '/admin/reports'
  - id: 'assert-reports'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-reports'
    action: 'screenshot'
    name: 'admin-reports'
  - id: 'open-users'
    action: 'open'
    url: '/admin/users'
  - id: 'assert-users'
    action: 'assertVisible'
    target:
      strategy: 'css'
      value: 'body'
  - id: 'snap-users'
    action: 'screenshot'
    name: 'admin-users'
